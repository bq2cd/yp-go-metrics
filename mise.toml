[tools]
go = "1.24"
golangci-lint = "latest"
"go:golang.org/x/tools/cmd/godoc" = "latest"

[tasks.fmt]
description = "Format Go code"
run = ["golangci-lint fmt"]

[tasks.generate]
description = "Generate Go code"
run = ["go generate ./..."]

[tasks.lint]
description = "Lint Go code"
run = ["golangci-lint run", "go run ./cmd/staticlint ./..."]

[tasks.test-dir]
hide = true
usage = '''
arg "<target_dir>" help="Run tests only for this directory"
arg "[go_test_args]" var=#true
'''
env = { "INTEGRATION" = "1" }
run = "go test -failfast -race {{ usage.target_dir }} {{ usage.go_test_args | default(value=[]) | join(sep=' ') }}"

[tasks.test]
description = "Test Go code"
run = [{ task = "test-dir ./..." }]

[tasks.coverage]
description = "Generate coverage for Go tests"
env = { "INTEGRATION" = "1" }
run = [
  "go test -failfast -cover -coverpkg=./... -coverprofile=coverage.out ./...",
  "go tool cover -html=coverage.out",
]

[tasks.e2e]
description = "Run end-to-end tests (test/e2e)"
usage = '''
flag "-p --parallel <parallel>" default="2" help="Tests parallelism (default: 2)"
'''
env = { "TEST_E2E" = "1" }
run = "go test -failfast -race -parallel {{ usage.parallel }} -count 1 -v ./test/e2e/..."

[tasks.pre-push]
description = "Validate Go code before pushing/creating PR"
run = [
  { task = "generate" },
  { task = "fmt" },
  { task = "lint" },
  { task = "test" },
  { task = "e2e" },
]
